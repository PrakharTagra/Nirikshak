version: '3.8'

services:
  preprocessor:
    build:
      context: .
      dockerfile: ./stage2_preprocessing/Dockerfile
    container_name: nirikshak-preprocessor
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/ComplianceEngine/output
      - ./stage4_ocr:/app/stage4_ocr
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirikshak-orchestrator
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      preprocessor:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - PREPROCESSOR_URL=http://preprocessor:8000
      - SHARED_OUTPUT_DIR=/app/output
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - GROQ_FALLBACK_TO_REGEX=true
      - PYTHON_CMD=python3
      - MONGODB_URI=${MONGODB_URI}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - ./output:/app/output
      - ./orchestrator/input:/app/input
      - ./orchestrator/temp:/app/orchestrator/temp
