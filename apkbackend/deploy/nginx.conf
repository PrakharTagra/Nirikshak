# ================================================================
# Nginx Reverse Proxy Configuration for Nirikshak Backend
# Domain: <your-subdomain>.duckdns.org
# Forward to: http://127.0.0.1:5000
# ================================================================

# Initial HTTP configuration (Certbot will automatically add SSL block on port 443)
server {
    listen 80;
    listen [::]:80;
    
    # REPLACE WITH YOUR ACTUAL DUCKDNS DOMAIN
    server_name YOUR_SUBDOMAIN.duckdns.org;

    # Allow larger body sizes for reports with high-res photo uploads
    client_max_body_size 30M;

    # Gzip compression for faster API responses
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 256;

    # Health check bypass / monitoring
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main API reverse proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket & connection upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forwarded Client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy processing (report generation / PDF uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable proxy buffering for streaming/fast responses
        proxy_buffering off;
    }
}
