# ==============================================================================
# Nginx Reverse Proxy Configuration for LM-Verify Backend Services
#
# Place this file in /etc/nginx/sites-available/lmverify.conf
# and symlink to /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limiting zone (optional, protects against brute force)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your EC2 Elastic IP or domain name:
    # server_name your-domain.com api.your-domain.com;
    server_name _;

    # Client body size for file/inspection uploads
    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # --------------------------------------------------------------------------
    # 1. Controller of Legal Metrology (Admin) API -> Port 4001
    # Accessible via: http(s)://<domain-or-ip>/clm-api/...
    # Example: /clm-api/health -> http://127.0.0.1:4001/api/health
    # --------------------------------------------------------------------------
    location /clm-api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:4001/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. Assistant Controller (Senior Inspector) API -> Port 4002
    # Accessible via: http(s)://<domain-or-ip>/ac-api/...
    # Example: /ac-api/health -> http://127.0.0.1:4002/api/health
    # --------------------------------------------------------------------------
    location /ac-api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:4002/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 3. GitHub Auto-Deploy Webhook -> Port 4005
    # Accessible via: https://<domain>/deploy-webhook
    # --------------------------------------------------------------------------
    location /deploy-webhook {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GitHub webhook payload headers
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;

        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Root health check endpoint
    location / {
        default_type application/json;
        return 200 '{"status":"ok","message":"LM-Verify API Gateway is running","services":{"clm_api":"/clm-api/health","ac_api":"/ac-api/health"}}';
    }
}
