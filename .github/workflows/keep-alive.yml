name: Nirikshak Render Keep-Alive Pinger

on:
  schedule:
    # Ping every 10 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping All Active Nirikshak Services
        shell: bash
        run: |
          echo "Starting Keep-Alive ping cycle at $(date -u)"
          
          # Target URLs for live Render microservices and Vercel endpoints
          TARGETS=(
            "${{ vars.RENDER_SCRAPER_URL || secrets.RENDER_SCRAPER_URL || 'https://lmverify-local-scraper-ibh1.onrender.com' }}"
            "${{ vars.RENDER_COMPLIANCE_URL || secrets.RENDER_COMPLIANCE_URL || 'https://nirikshak-compliance-engine-9uj4.onrender.com' }}"
            "${{ vars.VERCEL_GATEWAY_URL || secrets.VERCEL_GATEWAY_URL || 'https://nirikshak-kappa.vercel.app' }}"
          )

          for url in "${TARGETS[@]}"; do
            if [ -n "$url" ]; then
              base_url="${url%/}"
              if [[ "$base_url" == *"/ping" ]]; then
                ping_url="$base_url"
              else
                ping_url="$base_url/ping"
              fi
              
              echo "--> Sending keep-alive ping to: $ping_url"
              http_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 35 "$ping_url" || echo "failed")
              echo "    Response Status: $http_code"
            fi
          done
          
          echo "Keep-Alive ping cycle finished successfully."
