# ==============================================================================
# Nirikshak Render Blueprint (render.yaml)
# Hosts strictly the heavy microservices that cannot be deployed on Vercel
# (Dynamic Puppeteer / Chromium crawler and OCR Compliance Engine)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. LM-Verify Local Scraper (Live E-Commerce Scraper & PDF Generator)
  # Uses Puppeteer/Chromium for headless DOM evaluation & packaging analysis
  # ----------------------------------------------------------------------------
  - type: web
    name: lmverify-local-scraper
    runtime: node
    plan: free
    rootDir: lmVerify/local-scraper
    buildCommand: npm install && npx playwright install chromium
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "12"
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Nirikshak Compliance Engine Orchestrator Backend
  # Heavy OCR preprocessing, image vision analysis & legal rule verification
  # ----------------------------------------------------------------------------
  - type: web
    name: nirikshak-compliance-engine
    runtime: node
    plan: free
    rootDir: ComplianceEngine/orchestrator
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "12"
