# ==============================================================================
# Nirikshak Render Blueprint (render.yaml)
# Deploy all Nirikshak backends with 1-click on Render
# ==============================================================================

envVarGroups:
  - name: lmverify-shared-env
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ADMIN_FRONTEND_ORIGIN
        value: "https://nirikshak-omega.vercel.app"
      - key: SENIOR_INSPECTOR_FRONTEND_ORIGIN
        value: "https://nirikshak-y7y9.vercel.app"
      - key: CORS_ORIGIN
        value: "https://nirikshak-omega.vercel.app,https://nirikshak-y7y9.vercel.app,https://nirikshak-13jz.vercel.app"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "12"

services:
  # ----------------------------------------------------------------------------
  # 1. LM-Verify CLM Admin Backend (Powers https://nirikshak-omega.vercel.app/)
  # ----------------------------------------------------------------------------
  - type: web
    name: lmverify-admin-backend
    runtime: node
    plan: free
    rootDir: lmverifywebapp
    buildCommand: npm install
    startCommand: npm run start:clm-api
    healthCheckPath: /ping
    envVars:
      - fromGroup: lmverify-shared-env

  # ----------------------------------------------------------------------------
  # 2. LM-Verify Senior Inspector / AC Backend (Powers https://nirikshak-y7y9.vercel.app/ & DMI Auth)
  # ----------------------------------------------------------------------------
  - type: web
    name: lmverify-senior-inspector-backend
    runtime: node
    plan: free
    rootDir: lmverifywebapp
    buildCommand: npm install
    startCommand: npm run start:ac-api
    healthCheckPath: /ping
    envVars:
      - fromGroup: lmverify-shared-env
      - key: INSPECTOR_TOKEN_TTL
        value: 7d

  # ----------------------------------------------------------------------------
  # 3. LM-Verify Local Scraper (Powers https://nirikshak-13jz.vercel.app/)
  # ----------------------------------------------------------------------------
  - type: web
    name: lmverify-local-scraper
    runtime: node
    plan: free
    rootDir: lmVerify/local-scraper
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "12"

  # ----------------------------------------------------------------------------
  # 4. Nirikshak Mobile APK App Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: nirikshak-apk-backend
    runtime: node
    plan: free
    rootDir: apkbackend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "12"

  # ----------------------------------------------------------------------------
  # 5. Nirikshak Compliance Engine Orchestrator Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: nirikshak-compliance-engine
    runtime: node
    plan: free
    rootDir: ComplianceEngine/orchestrator
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "12"
