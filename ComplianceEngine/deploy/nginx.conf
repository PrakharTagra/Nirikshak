# Nirikshak ComplianceEngine — Nginx Reverse Proxy Configuration
server {
    listen 80;
    server_name _;

    # Allow large multi-panel photo uploads from mobile camera (up to 50MB)
    client_max_body_size 50M;

    # Gzip Compression for JSON responses
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for OCR and Groq LLM processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer configurations for uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
